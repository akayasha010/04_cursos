<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>techAcademy</title>
    <link rel="stylesheet" href="CSS/miestilos.css">
</head>

<body>
    <header>
        <div id="logo">
            <h1>TechAcademy</h1>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoria</a></li>
                <li><a href="inscripcion.html" class="btn_destacado">Inscribirse</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero_contenido">
                <h2>Aprende las tecnologias del futuro, hoy</h2>
                <p>Cursos practicos liderados por expertos en la industria. Desde cero hasta nivel profesional.</p>
                <a href="index.html" class="btn_accion">Ver Catalogo</a>
            </div>
            <div class="hero_imagen">
                <img src="images/img1.jpg" alt="Estudiante programando">
            </div>
        </section>
        <section class="formulario">
            <div class="formulario_contenido">
                <h2>Formulario de Inscripcion</h2>
                <form action="#" method="GET" class="formulario_inscripcion">
                    <div class="formulario_campo">
                        <label>Apellidos:</label>
                        <input type="text" name="apellidos" required>

                        <label>Nombres:</label>
                        <input type="text" name="nombre" required>
                        

                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>

                        <label for="curso">Curso de Interés:</label>
                        <select id="curso" name="curso" required>
                            <option value="">Seleccione un curso</option>
                            <option value="fundamentos">Fundamentos del marketing digital y el comercio electronico</option>
                            <option value="google">Google Marketing digital y comercio electronico</option>
                            <option value="marketing-digital">Marketing Digital</option>
                            <option value="redes-sociales">Marketing en redes sociales de Meta</option>
                            <option value="desarrollo-web">Desarrollo web frontend</option>
                            <option value="python">Python para Ciencia de Datos</option>
                            <option value="bases-datos">Bases de Datos Robustas</option>
                            <option value="backend">Programacion Backend con APIs</option>
                        </select>
                        <label for="nivel">nivel del curso:</label>
                        <select id="nivel" name="nivel" required>
                            <option value="">Seleccione un nivel</option>
                            <option value="principiante">Principiante</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                        <label for="modalidad">Modalidad:</label>
                        <select id="modalidad" name="modalidad" required>
                            <option value="">Seleccione una modalidad</option>
                            <option value="presencial">Presencial</option>
                            <option value="en-linea">En Línea</option>
                        </select>

                        <button type="submit">Enviar Inscripción</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>TechAcademy &copy; 2026</p>
    </footer>
</body>

</html>
